version: 2

sources:
  - name: raw
    description: "Raw ISTDATEN table loaded by the Airflow ingestion DAG."
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_DATASET', 'sbb_punctuality') }}"
    tables:
      - name: ist_daten_raw
        description: "Unmodeled raw stop-event records from opentransportdata.swiss."
        config:
          loaded_at_field: "cast(betriebstag_date as timestamp)"
          freshness:
            warn_after: {count: 36, period: hour}
            error_after: {count: 60, period: hour}
        columns:
          - name: BETRIEBSTAG
            tests:
              - not_null
          - name: FAHRT_BEZEICHNER
            tests:
              - not_null
          - name: AN_PROGNOSE_STATUS
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: VERKEHRSMITTEL_TEXT
            tests:
              - not_null:
                  config:
                    severity: warn
