version: 2

models:
  - name: int_delays
    description: "Delay-centric model with SBB 3-minute significance threshold and canonical delay flags."
    columns:
      - name: operating_day
        tests:
          - not_null
      - name: journey_id
        tests:
          - not_null
      - name: station_uic
        tests:
          - not_null
      - name: arrival_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["REAL", "ESTIMATED"]
      - name: arrival_delay_min
        description: "Arrival delay in minutes, actual - scheduled."
        tests:
          - not_null
