version: 2

models:
  - name: fct_daily_delays
    description: "Daily punctuality KPIs by operating day, transport type, and line."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - operating_day
              - transport_type
              - line_name
    columns:
      - name: operating_day
        tests:
          - not_null
      - name: transport_type
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_transport_types')
                field: transport_type
      - name: line_name
        tests:
          - not_null
      - name: total_events
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: pct_on_time
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                strictly: false
      - name: pct_delayed_3min
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                strictly: false
      - name: total_cancelled
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false

  - name: fct_station_delays
    description: "Daily punctuality KPIs by station."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - operating_day
              - station_uic
    columns:
      - name: operating_day
        tests:
          - not_null
      - name: station_uic
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_uic
      - name: station_name
        tests:
          - not_null
      - name: total_events
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: pct_on_time
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                strictly: false
      - name: pct_delayed_3min
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                strictly: false
      - name: total_cancelled
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false

  - name: dim_stations
    description: "Station lookup table."
    columns:
      - name: station_uic
        tests:
          - not_null
          - unique
      - name: station_name
        tests:
          - not_null

  - name: dim_operators
    description: "Operator lookup table."
    columns:
      - name: operator_id
        tests:
          - not_null
          - unique

  - name: dim_transport_types
    description: "Transport type lookup table."
    columns:
      - name: transport_type
        tests:
          - not_null
          - unique
      - name: transport_type_label
        tests:
          - not_null
      - name: transport_type_description
        tests:
          - not_null
      - name: mapping_source
        tests:
          - not_null
      - name: is_mapped
        tests:
          - not_null

  - name: bi_transport_daily
    description: "Dashboard-ready daily transport KPIs with additive numerators/denominators."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - operating_day
              - transport_type
    columns:
      - name: operating_day
        tests:
          - not_null
      - name: transport_type
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_transport_types')
                field: transport_type
      - name: transport_type_label
        tests:
          - not_null
      - name: total_events
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: events_on_time
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: events_delayed_3min
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: pct_on_time
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                strictly: false
      - name: pct_delayed_3min
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                strictly: false
      - name: total_cancelled
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false

  - name: bi_delay_heatmap
    description: "Dashboard-ready hour/day rollup with delay totals and punctuality KPIs."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - operating_day
              - transport_type
              - day_of_week_num
              - hour_of_day
    columns:
      - name: operating_day
        tests:
          - not_null
      - name: transport_type
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_transport_types')
                field: transport_type
      - name: transport_type_label
        tests:
          - not_null
      - name: hour_of_day
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 23
                strictly: false
      - name: day_of_week_num
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 7
                strictly: false
      - name: total_events
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: events_on_time
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: pct_on_time
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                strictly: false
