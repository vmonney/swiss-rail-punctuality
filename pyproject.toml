[project]
name = "swiss-rail-punctuality"
version = "0.1.0"
description = "Swiss Rail punctuality analytics project foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.0.0",
    "marimo",
    "pandas",
    "pyarrow",
    "requests>=2.32.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "dbt-bigquery>=1.11.1",
    "dbt-core>=1.11.7",
    "ruff",
    "sqlfluff",
    "sqlfluff-templater-dbt>=4.0.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.setuptools.packages.find]
where = ["src"]
